site_name: IOS XR Hands-on
site_description: Hands-on labs for Cisco IOS XR operations, routing, and troubleshooting.
site_dir: site
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - glightbox
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - 00. Preparation: 00-preparation/index.md
  - 01. Commit configuration: 01-commit-configuration/index.md
  - 02. Operations and monitoring: 02-operations-and-monitoring/index.md
  - 03. ISIS and segment routing: 03-bgp-and-isis/index.md
  - 04. BGP: 04-bgp/index.md
